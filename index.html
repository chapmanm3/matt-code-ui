<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matt Code UI</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar" class="collapsible-sidebar">
        <div class="sidebar-header">
          <button class="collapse-btn" data-target="sidebar" title="Toggle Files">‹</button>
          <span class="sidebar-title">Files</span>
        </div>
        <div id="current-path" class="current-path"></div>
        <div id="file-list" class="file-list"></div>
      </aside>
      <aside id="session-sidebar" class="session-sidebar collapsible-sidebar">
        <div class="sidebar-header">
          <button class="collapse-btn" data-target="session-sidebar" title="Toggle Sessions">‹</button>
          <span class="sidebar-title">Sessions</span>
          <button id="new-session-btn" class="new-session-btn" title="New Session">+</button>
        </div>
        <div id="session-list" class="session-list"></div>
      </aside>
      <div id="main-area">
        <main id="main-content" style="display:none">
          <div class="welcome">
            <h1>Matt Code UI</h1>
            <p>Select a file to view its contents</p>
          </div>
        </main>
        <div id="terminal-container" class="terminal-container full-height">
          <div class="terminal-header">
            <div class="tab-bar">
              <button class="new-tab" title="New Terminal (Ctrl+T)">+</button>
              <button class="new-chat" title="New Chat (Ctrl+C)">💬</button>
            </div>
            <button id="toggle-terminal" class="terminal-toggle"></button>
          </div>
          <div id="terminal" class="terminal"></div>
          <div id="chat-container" class="chat-container" style="display:none">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-container">
              <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." />
              <button id="chat-send" class="chat-send">Send</button>
            </div>
          </div>
          <div class="status-bar">
            <span id="status-info">Terminal</span>
            <span class="status-right">
              <span class="status-item">Ctrl+Tab: Next Tab</span>
              <span class="status-item">Ctrl+Shift+Tab: Prev Tab</span>
              <span class="status-item">Ctrl+T: New Tab</span>
              <span class="status-item">Ctrl+C: New Chat</span>
              <span class="status-item">Ctrl+W: Close Tab</span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
