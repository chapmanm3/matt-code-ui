<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matt Code UI</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar" class="collapsible-sidebar">
        <div class="sidebar-header">
          <button class="collapse-btn" data-target="sidebar" title="Toggle Files" aria-expanded="true" aria-label="Toggle file browser">‹</button>
          <span class="sidebar-title">Files</span>
        </div>
        <div id="current-path" class="current-path"></div>
        <div id="file-list" class="file-list"></div>
      </aside>
      <aside id="worktree-sidebar" class="worktree-sidebar collapsible-sidebar">
        <div class="sidebar-header">
          <button class="collapse-btn" data-target="worktree-sidebar" title="Toggle Worktrees" aria-expanded="true" aria-label="Toggle worktree browser">‹</button>
          <span class="sidebar-title">Worktrees</span>
          <button id="new-worktree-btn" class="new-worktree-btn" title="New Worktree">+</button>
          <button id="refresh-worktrees-btn" class="refresh-worktrees-btn" title="Refresh">↻</button>
        </div>
        <div id="worktree-list" class="worktree-list"></div>
        <div id="worktree-empty" class="worktree-empty" style="display:none">
          Not a git repository
        </div>
      </aside>
      <aside id="session-sidebar" class="session-sidebar collapsible-sidebar">
        <div class="sidebar-header">
          <button class="collapse-btn" data-target="session-sidebar" title="Toggle Sessions" aria-expanded="true" aria-label="Toggle session browser">‹</button>
          <span class="sidebar-title">Sessions</span>
          <button id="new-session-btn" class="new-session-btn" title="New Session">+</button>
        </div>
        <div id="session-list" class="session-list"></div>
      </aside>
      <div id="main-area">
        <main id="main-content" style="display:none">
          <div class="welcome">
            <h1>Matt Code UI</h1>
            <p>Select a file to view its contents</p>
          </div>
        </main>
        <div id="terminal-container" class="terminal-container full-height">
          <div class="terminal-header">
            <div class="tab-bar">
              <button class="new-tab" title="New Terminal (Alt+T)">+</button>
              <button class="new-chat" title="New Chat (Ctrl+Shift+C)">💬</button>
            </div>
          </div>
          <div id="terminal" class="terminal"></div>
          <div id="chat-container" class="chat-container" style="display:none">
            <div class="chat-header">
              <span class="chat-header-title">Chat</span>
              <select id="model-selector" class="model-selector">
                <option value="">Loading models...</option>
              </select>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-container">
              <textarea id="chat-input" class="chat-input" placeholder="Type a message..." rows="1"></textarea>
              <button id="chat-send" class="chat-send">Send</button>
            </div>
          </div>
          <div class="status-bar">
            <span id="status-info">Terminal</span>
            <span class="status-right">
              <span class="status-item">Alt+Tab: Next Tab</span>
              <span class="status-item">Alt+Shift+Tab: Prev Tab</span>
              <span class="status-item">Alt+T: New Terminal</span>
              <span class="status-item">Ctrl+Shift+C: New Chat</span>
              <span class="status-item">Alt+W: Close Tab</span>
              <span class="status-item">Ctrl+Alt+←/→: Switch Worktree</span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div id="worktree-modal" class="modal-overlay" style="display:none">
      <div class="modal">
        <div class="modal-header">Create New Worktree</div>
        <div class="modal-body">
          <div class="form-group">
            <label>Branch name: <input id="worktree-branch-input" type="text" placeholder="feature/my-feature"></label>
          </div>
          <div class="form-group">
            <label>Path (optional): <input id="worktree-path-input" type="text" placeholder="Auto-generated if empty"></label>
          </div>
        </div>
        <div id="worktree-modal-error" class="modal-error" style="display:none"></div>
        <div class="modal-footer">
          <button id="worktree-modal-cancel">Cancel</button>
          <button id="worktree-modal-create">Create</button>
        </div>
      </div>
    </div>
  </body>
</html>
